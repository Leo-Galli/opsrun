name: Bug report
description: Report a defect in OpsRun
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Redact secrets, private keys, vault tokens, and sensitive hostnames before pasting output or runbooks.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reproduce the issue.
      value: |
        1. Run `opsrun ...`
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include full command output with secrets redacted.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OpsRun version, OS, and related context.
      value: |
        - OpsRun version (`opsrun version`):
        - OS / architecture:
        - Go version (if built from source):
        - Target host OS (if relevant):
    validations:
      required: true
  - type: textarea
    id: runbook
    attributes:
      label: Runbook and configuration
      description: Minimal redacted runbook and `opsrun.yaml` that reproduce the issue, if applicable.
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I redacted secrets, credentials, and sensitive hostnames from this report
          required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Redacted audit log excerpts, stack traces, or related context.
    validations:
      required: false
