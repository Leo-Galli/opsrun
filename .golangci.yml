run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam

linters-settings:
  govet:
    enable-all: true
  revive:
    rules:
      - name: exported

issues:
  exclude-dirs:
    - testdata
  max-issues-per-linter: 0
  max-same-issues: 0
